{% extends "base.html" %}
{% load static %}

{% block title %}
<title>Job Vacancy Form</title>
{% endblock %}

{% block content %}

<div class="job-form-page">

  <div class="job-form-card">
    <h1 class="job-form-title">Job Vacancy Form</h1>
    <p class="job-form-subtitle">
      Fill the details below to post a new job ✅
    </p>

    <form method="post" class="job-form">
      {% csrf_token %}

      <div class="job-form-fields">
        {{ form.as_p }}
      </div>

      <div class="job-form-buttons">
        <button type="submit" class="btn-submit">Submit</button>
        <button type="reset" class="btn-reset">Reset</button>
      </div>
    </form>
  </div>

</div>

{% endblock %}
